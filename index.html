<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIV/AIDS Surveillance System | DOH Philippines</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- LOGIN PAGE -->
    <div
      id="login-page"
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--bg);
      "
    >
      <div
        style="
          width: 100%;
          max-width: 420px;
          padding: 40px;
          background: var(--surface);
          border-radius: 16px;
          border: 1px solid var(--border);
        "
      >
        <div style="text-align: center; margin-bottom: 30px">
          <h1 style="color: #c0392b">HIV/AIDS Repository</h1>
          <p style="color: var(--text3)">Department of Health • Philippines</p>
        </div>
        <h2 style="text-align: center; margin-bottom: 25px">Sign In</h2>

        <input
          type="email"
          id="login-email"
          class="fi-input"
          placeholder="Email"
          style="width: 100%; margin-bottom: 15px"
          value="admin@doh.gov.ph"
        />
        <input
          type="password"
          id="login-password"
          class="fi-input"
          placeholder="Password"
          style="width: 100%; margin-bottom: 20px"
          value="DOHAdmin2025!"
        />

        <button
          onclick="loginUser()"
          style="
            width: 100%;
            padding: 14px;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
          "
        >
          Sign In
        </button>

        <p
          style="
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
          "
        >
          Demo Account:<br />
          <strong>admin@doh.gov.ph</strong> / <strong>DOHAdmin2025!</strong>
        </p>
      </div>
    </div>

    <!-- MAIN APPLICATION -->
    <div id="main-app" style="display: none">
      <div class="shell">
        <!-- Paste your original sidebar + main content here -->
        <!-- For now, we'll use a simple placeholder. You can copy your old shell content -->
        <nav class="sidebar" id="sidebar">
          <!-- Your sidebar content -->
          <div class="sb-brand">
            <div class="sb-logo"><i class="fas fa-heartbeat"></i></div>
            <div>
              <div class="sb-name">HIV/AIDS Repository</div>
              <div class="sb-sub">DOH Philippines</div>
            </div>
          </div>
          <!-- Add rest of sidebar items -->
        </nav>

        <div class="main">
          <!-- Your topbar and content here -->
          <div class="topbar">
            <div class="hbg" onclick="toggleSB()">☰</div>
            <div class="tb-title" id="pg-title">Dashboard Overview</div>
            <div class="tb-right">
              <button onclick="toggleDark()" class="ib">🌙</button>
              <button
                onclick="logoutUser()"
                class="ib"
                style="background: #c0392b; color: white"
              >
                Logout
              </button>
            </div>
          </div>

          <div class="content">
            <!-- Your pages (p-dash, p-repo, etc.) go here -->
            <!-- You can copy them from your previous index.html -->
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
