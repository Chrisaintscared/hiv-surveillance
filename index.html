<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIV/AIDS Surveillance System | DOH Philippines</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <style>
      #login-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <!-- LOGIN PAGE -->
    <div id="login-page">
      <div
        style="
          width: 100%;
          max-width: 420px;
          padding: 40px;
          background: var(--surface);
          border-radius: 16px;
          border: 1px solid var(--border);
        "
      >
        <div style="text-align: center; margin-bottom: 30px">
          <h1 style="color: #c0392b; margin-bottom: 8px">
            HIV/AIDS Repository
          </h1>
          <p style="color: var(--text3)">Department of Health Philippines</p>
        </div>

        <h2 style="text-align: center; margin-bottom: 25px">Sign In</h2>

        <input
          type="email"
          id="login-email"
          class="fi-input"
          placeholder="Email Address"
          style="width: 100%; margin-bottom: 15px"
          value="admin@doh.gov.ph"
        />
        <input
          type="password"
          id="login-password"
          class="fi-input"
          placeholder="Password"
          style="width: 100%; margin-bottom: 20px"
          value="DOHAdmin2025!"
        />

        <button
          onclick="loginUser()"
          style="
            width: 100%;
            padding: 14px;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
          "
        >
          Sign In
        </button>

        <p style="text-align: center; color: #64748b; font-size: 14px">
          Default: <strong>admin@doh.gov.ph</strong> /
          <strong>DOHAdmin2025!</strong>
        </p>
      </div>
    </div>

    <!-- MAIN APPLICATION -->
    <div id="main-app" style="display: none">
      <!-- Your original sidebar and content will go here -->
      <!-- Paste your previous main shell content here if needed, but we'll handle it in JS -->
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
