<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIV/AIDS Surveillance System | DOH Philippines</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <style>
      :root {
        --bg-dark: #0f172a;
        --bg-gradient-end: #1e1133;
        --primary-red: #c0392b;
        --hover-red: #e74c3c;
        --glass-bg: rgba(255, 255, 255, 0.08);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        padding: 0;
      }

      .hero {
        background: linear-gradient(
          135deg,
          var(--bg-dark) 0%,
          var(--bg-gradient-end) 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
        color: var(--text-main);
      }

      /* Immersive Radial Glare */
      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 40% 30%,
          rgba(192, 57, 43, 0.25),
          transparent 70%
        );
        z-index: 1;
      }

      /* Floating Red Particles */
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(
            2px 2px at 10px 10px,
            rgba(192, 57, 43, 0.7),
            rgba(0, 0, 0, 0)
          ),
          radial-gradient(
            2px 2px at 200px 150px,
            rgba(192, 57, 43, 0.5),
            rgba(0, 0, 0, 0)
          ),
          radial-gradient(
            2px 2px at 450px 300px,
            rgba(192, 57, 43, 0.8),
            rgba(0, 0, 0, 0)
          );
        background-size: 550px 550px;
        z-index: 1;
        opacity: 0.6;
        animation: particleAnimation 60s linear infinite;
      }

      .content {
        position: relative;
        z-index: 2;
      }

      /* Glassmorphism Stat Box */
      .stat-box {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px); /* Safari support */
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        transition: all 0.3s ease;
      }

      .stat-box:hover {
        border-color: rgba(192, 57, 43, 0.4);
        transform: translateY(-2px);
      }

      /* Red Primary Button */
      .btn-get-started {
        background: var(--primary-red);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-get-started:hover {
        background: var(--hover-red);
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(192, 57, 43, 0.4);
      }

      /* Pulsing Text Effect for Crimson span */
      .pulse-text {
        color: var(--primary-red);
        animation: textPulse 4s ease-in-out infinite;
      }

      /* Keyframes */
      @keyframes particleAnimation {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 550px 550px;
        }
      }

      @keyframes textPulse {
        0%,
        100% {
          text-shadow: 0 0 5px rgba(192, 57, 43, 0);
        }
        50% {
          text-shadow: 0 0 15px rgba(192, 57, 43, 0.5);
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="max-w-6xl mx-auto px-6 py-20 content w-full">
        <div class="max-w-2xl">
          <!-- Agency Header -->
          <div
            class="flex items-center gap-3 mb-6 text-sm tracking-widest text-slate-400 font-medium"
          >
            <i class="fas fa-shield-alt text-[#c0392b]"></i>
            REPUBLIC OF THE PHILIPPINES • DEPARTMENT OF HEALTH
          </div>

          <!-- Main Headline -->
          <h1
            class="text-6xl md:text-7xl font-extrabold leading-none mb-6 tracking-tighter"
          >
            Real-Time<br />
            <span class="pulse-text">HIV/AIDS Surveillance</span>
          </h1>

          <!-- Sub-headline -->
          <p class="text-xl text-slate-300 mb-10 font-normal leading-relaxed">
            Empowering data-driven decisions to eliminate HIV in the Philippines
            through real-time monitoring and actionable insights.
          </p>

          <!-- Action Buttons -->
          <div class="flex flex-col sm:flex-row gap-4 mb-16">
            <button
              onclick="goToLogin()"
              class="btn-get-started px-10 py-5 rounded-2xl text-lg font-semibold flex items-center justify-center gap-3 w-full sm:w-auto"
            >
              Get Started
              <i class="fas fa-arrow-right"></i>
            </button>

            <button
              onclick="window.location.href = 'index.html'"
              class="px-8 py-5 border border-white/20 hover:bg-white/5 hover:border-white/30 rounded-2xl text-lg font-medium transition duration-300 w-full sm:w-auto"
            >
              View Demo
            </button>
          </div>

          <!-- Glassmorphism Stats -->
          <div
            class="stat-box p-8 md:p-10 grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-4 shadow-2xl"
          >
            <!-- Active Cases -->
            <div class="text-center px-4">
              <div
                class="text-5xl font-extrabold text-white mb-2 leading-none"
                id="stat-cases"
              >
                1,248
              </div>
              <div
                class="text-sm font-semibold uppercase tracking-widest text-slate-400"
              >
                Active Cases
              </div>
            </div>

            <!-- On ART (Dividers) -->
            <div class="text-center md:border-x border-white/10 px-4">
              <div
                class="text-5xl font-extrabold text-teal-400 mb-2 leading-none"
                id="stat-art"
              >
                892
              </div>
              <div
                class="text-sm font-semibold uppercase tracking-widest text-slate-400"
              >
                On ART
              </div>
            </div>

            <!-- Regions -->
            <div class="text-center px-4">
              <div
                class="text-5xl font-extrabold text-purple-400 mb-2 leading-none"
                id="stat-regions"
              >
                17
              </div>
              <div
                class="text-sm font-semibold uppercase tracking-widest text-slate-400"
              >
                Regions
              </div>
            </div>
          </div>

          <!-- Live Monitoring Footer -->
          <div
            class="mt-12 flex items-center gap-3 text-sm text-slate-400 font-medium"
          >
            <i class="fas fa-heartbeat text-[#c0392b]"></i>
            <span>Live Monitoring • Nationwide • Secure • Real-time</span>
          </div>
        </div>
      </div>

      <!-- Decorative Large Faded Heartbeat Icon -->
      <div
        class="hidden lg:block absolute right-[-10%] bottom-[-10%] opacity-10"
      >
        <div class="text-[350px] text-[#c0392b]">
          <i class="fas fa-heartbeat"></i>
        </div>
      </div>
    </section>

    <script>
      // Smooth Counter Animation
      function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        if (!obj) return;

        let startTimestamp = null;
        const step = (timestamp) => {
          if (!startTimestamp) startTimestamp = timestamp;
          const progress = Math.min((timestamp - startTimestamp) / duration, 1);

          // Easing function for smoother finish
          const easedProgress = 1 - Math.pow(1 - progress, 3); // easeOutCubic

          const value = Math.floor(easedProgress * (end - start) + start);
          obj.textContent = value.toLocaleString();

          if (progress < 1) {
            window.requestAnimationFrame(step);
          }
        };
        window.requestAnimationFrame(step);
      }

      // Trigger animation on load
      window.onload = () => {
        // Small delay for better impact after load
        setTimeout(() => {
          animateValue("stat-cases", 900, 1248, 2000);
          animateValue("stat-art", 650, 892, 2200);
          animateValue("stat-regions", 12, 17, 1800);
        }, 300);
      };

      // Redirect Function
      function goToLogin() {
        // Relative path is better for deployment
        window.location.href = "./screens/login.html";
      }
    </script>
  </body>
</html>
