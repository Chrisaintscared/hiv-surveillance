<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOH Repository | Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            background: #050810; 
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #cbd5e1;
        }

        .glass-card { 
            background: rgba(20, 27, 45, 0.7); 
            border: 1px solid rgba(255,255,255,0.08); 
            backdrop-filter: blur(16px); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        input {
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #c0392b !important;
            box-shadow: 0 0 15px rgba(192, 57, 43, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass-card p-10 rounded-[2.5rem] w-full max-w-sm">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-red-600 rounded-[1.5rem] flex items-center justify-center mx-auto mb-6 shadow-[0_0_40px_rgba(192,57,43,0.4)] animate-pulse">
                <i class="fas fa-heartbeat text-white text-4xl"></i>
            </div>
            <h1 id="auth-title" class="text-white font-black text-2xl tracking-tighter uppercase">Sign In</h1>
            <p id="auth-desc" class="text-slate-500 text-[10px] mt-2 uppercase tracking-widest font-bold">Surveillance Unit</p>
        </div>

        <div class="space-y-5">
            <div class="space-y-2">
                <label class="text-[10px] text-slate-500 font-black uppercase ml-2 tracking-widest">Email Address</label>
                <input type="email" id="login-email" placeholder="name@doh.gov.ph" 
                    class="w-full p-4 bg-slate-950/50 border border-white/10 rounded-2xl text-white outline-none">
            </div>
            
            <div class="space-y-2">
                <label class="text-[10px] text-slate-500 font-black uppercase ml-2 tracking-widest">Access Key</label>
                <input type="password" id="login-password" placeholder="••••••••" 
                    class="w-full p-4 bg-slate-950/50 border border-white/10 rounded-2xl text-white outline-none">
            </div>

            <button id="auth-btn" onclick="handleAuth()" 
                class="w-full py-4 bg-red-600 hover:bg-red-500 text-white font-black rounded-2xl shadow-lg shadow-red-600/20 transition-all transform active:scale-95 uppercase text-sm tracking-widest">
                Sign In
            </button>

            <div class="text-center mt-8">
                <button onclick="toggleAuth()" class="text-[11px] text-slate-500 hover:text-white transition">
                    <span id="auth-toggle-text">Need an account? <span class="text-red-500 font-bold">Click here.</span></span>
                </button>
            </div>
        </div>
    </div>

    <script src="../assets/js/supabaseClient.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
