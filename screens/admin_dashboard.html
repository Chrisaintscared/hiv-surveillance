<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DOH HARP | Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap");
      :root {
        --bg: #050810;
        --card: rgba(20, 27, 45, 0.7);
        --accent: #c0392b;
      }
      body {
        background-color: var(--bg);
        color: #cbd5e1;
        font-family: "Plus Jakarta Sans", sans-serif;
        background-image: radial-gradient(
          circle at 50% 0%,
          #1e1b4b 0%,
          transparent 50%
        );
      }
      .glass-card {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border-radius: 28px;
      }
      #sidebar {
        width: 280px;
        background: rgba(10, 14, 26, 0.95);
        backdrop-filter: blur(10px);
        transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 16px 28px;
        color: #64748b;
        font-size: 14px;
        transition: 0.3s;
        border-left: 3px solid transparent;
      }
      .nav-item:hover,
      .nav-item.active {
        color: #fff;
        background: linear-gradient(
          90deg,
          rgba(192, 57, 43, 0.1) 0%,
          transparent 100%
        );
        border-left: 3px solid var(--accent);
      }
    </style>
  </head>
  <body class="flex h-screen overflow-hidden">
    <nav id="sidebar" class="flex flex-col border-r border-white/5">
      <div class="p-10 mb-4 flex items-center gap-3">
        <div
          class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center shadow-lg shadow-red-900/40"
        >
          <i class="fas fa-user-shield text-white"></i>
        </div>
        <h1 class="font-black text-white leading-none tracking-tighter text-xl">
          ADMIN<br /><span
            class="text-red-500 text-[10px] font-bold tracking-widest uppercase"
            >Console</span
          >
        </h1>
      </div>
      <div class="flex-1">
        <a href="#" class="nav-item active"
          ><i class="fas fa-toolbox"></i> System Overview</a
        >
        <a href="#" class="nav-item"
          ><i class="fas fa-users-gear"></i> User Management</a
        >
        <a href="#" class="nav-item"
          ><i class="fas fa-database"></i> Database Logs</a
        >
      </div>
      <div class="p-8">
        <button
          onclick="logoutUser()"
          class="w-full p-4 glass-card text-red-500 font-bold text-xs flex items-center justify-center gap-3 hover:bg-red-500/10 transition"
        >
          <i class="fas fa-power-off"></i> EXIT CONSOLE
        </button>
      </div>
    </nav>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="h-24 flex items-center justify-between px-12">
        <h2 class="text-xl font-bold text-white tracking-tight">
          Administrative Privileges Active
        </h2>
        <div
          class="text-xs font-mono text-red-500 bg-red-500/10 px-3 py-1 rounded-full border border-red-500/20"
        >
          SECURE_ROOT_ACCESS
        </div>
      </header>
      <div class="p-12">
        <div class="glass-card p-10">
          <h3 class="text-white font-bold mb-4">Welcome, System Admin</h3>
          <p class="text-slate-400 text-sm">
            Use this panel to manage health officer access and system-wide
            surveillance settings.
          </p>
        </div>
      </div>
    </main>

    <script src="../assets/js/supabaseClient.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
